# Native PSX+, O'Hare and ATI-264GT. Original ROM 6E92FE08.
model = 6500
rom = "power-macintosh-6500.rom"
runner = "ppc"
jit = true
ram_mb = 32
disk_bus = "ata"
post_clean = true

[media]
"cd.img" = { kib = 800, name = "Livadix CD" }
"floppy-hd.img" = { kib = 1440, name = "Livadix HD Floppy" }

