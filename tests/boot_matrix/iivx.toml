# The VASP board's boot matrix (tests/verify.py, check os-boot; the keys
# are described there): the Macintosh IIvx, IIvi and Performa 600, one ROM
# (src/hw/machines/iivx.c). Every run is headless, on work copies of the
# images.

model = "iivx"
rom = "iivx.rom"
ram_mb = 20
# What every System reports on these machines (Inside Macintosh: Operating
# System Utilities, "Gestalt Manager"): the 68030 (proc 4) and its MMU
# (mmu 3). Machine types: IIvx Developer Note, "Identifying the Macintosh
# IIvx" (48, 45, 44).
gestalt = { proc = 4, "mmu " = 3 }

[media]
"cd.img" = { kib = 800, name = "Livadix CD" }
"floppy-hd.img" = { kib = 1440, name = "Livadix HD Floppy" }
"floppy-dd.img" = { kib = 800, name = "Livadix Floppy" }

# --- IIvx -------------------------------------------------------------------------------

# The built-in video (Developer Note, Table 1-3): the 12-inch RGB, and the
# 13-inch at 16 bits with 1 MB of VRAM, at the ROM's start screen (the
# depth the slot PRAM gives).
[[cell]]
name = "IIvx, 512x384"
resolution = "512x384"
depth = 16
max = 60_000_000
screen = "512x384, 16 bits, 1024 bytes per row"
[[cell]]
name = "IIvx, 640x480x16"
depth = 16
max = 60_000_000
screen = "640x480, 16 bits, 2048 bytes per row"
note = "1 MB of VRAM"
[[cell]]
name = "IIvx, 640x480x1"
depth = 1
max = 60_000_000
screen = "640x480, 1 bits, 1024 bytes per row"
