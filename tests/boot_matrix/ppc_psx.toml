# Native PSX, O'Hare and Valkyrie AV2. Original ROM 6F5724C0.
model = 6400
rom = "power-macintosh-6400.rom"
runner = "ppc"
jit = true
ram_mb = 16
disk_bus = "ata"
post_clean = true

[media]
"cd.img" = { kib = 800, name = "Livadix CD" }
"floppy-hd.img" = { kib = 1440, name = "Livadix HD Floppy" }

[[cell]]
name = "5400, 8 MiB POST"
model = 5400
ram_mb = 8
seconds = 8
screen = true
chime = true
gestalt = { mach = 74 }

